[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Hangs must die with a stack dump, not spin for an hour (2026-07-24 OOM):
# the thread method fires even when the asyncio event loop is blocked.
addopts = "--timeout=120 --timeout-method=thread"

[tool.coverage.run]
source = ["custom_components/samsung_ac_windfree"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001"]
