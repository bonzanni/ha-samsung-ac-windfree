name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_RLIMIT_AS_GB: "2"

jobs:
  stable:
    name: Stable HA 2026.7.3 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install stable dependency set
        run: python -m pip install -r requirements_test.txt
      - name: Capture and validate dependency closure
        run: |
          python -m pip freeze --all | tee dependency-closure-stable.txt
          python -m pip check
      - name: Exercise the real dependency contract
        run: |
          ulimit -v 2097152
          python -m pytest tests/test_dependency_contract.py -q --timeout=120
      - name: Run the complete stable suite with coverage
        run: |
          ulimit -v 2097152
          python -m pytest tests -q --timeout=120 \
            --cov=custom_components/samsung_ac_windfree \
            --cov-report=term-missing --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-closure-stable-${{ matrix.runner }}
          path: dependency-closure-stable.txt

  architecture-smoke:
    name: Runtime dependency smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build dependency smoke image
        run: |
          docker buildx build --platform "${{ matrix.platform }}" \
            --load --tag windfree-smoke:ci .github/smoke
      - name: Import runtime dependencies without network
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            --memory=2g --network=none windfree-smoke:ci \
            python -c "import smartthings_local, cbor2"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.15.21
      - run: ruff format --check custom_components tests .github/scripts
      - run: ruff check custom_components tests .github/scripts

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          ignore: brands

  beta-canary:
    name: Scheduled HA beta canary
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install isolated beta dependency set
        run: >-
          python -m pip install --pre --upgrade
          pytest-homeassistant-custom-component
          smartthings-local==0.1.0 cbor2==6.1.3
      - name: Capture and validate beta closure
        run: |
          python -m pip freeze --all | tee dependency-closure-beta.txt
          python -m pip check
          python -c "import homeassistant; print(homeassistant.__version__)"
      - name: Exercise the real dependency contract
        run: |
          ulimit -v 2097152
          python -m pytest tests/test_dependency_contract.py -q --timeout=120
      - name: Run complete beta suite
        run: |
          ulimit -v 2097152
          python -m pytest tests -q --timeout=120
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-closure-beta
          path: dependency-closure-beta.txt

  samsung-pin-canary:
    name: Scheduled Samsung public-pin canary
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install cryptography==48.0.1
      - run: python .github/scripts/check_samsung_pins.py
      - name: Prove the canary accepted and committed nothing
        run: git diff --exit-code
