name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_RLIMIT_AS_GB: "2"

jobs:
  stable:
    name: Stable HA 2026.7.3 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install stable dependency set
        run: python -m pip install -r requirements_test.txt
      - name: Capture and validate dependency closure
        run: |
          python -m pip freeze --all | tee dependency-closure-stable.txt
          sha256sum dependency-closure-stable.txt | tee dependency-closure-stable.txt.sha256
          python -m pip check
      - name: Exercise the real dependency contract
        run: |
          ulimit -v 2097152
          python -m pytest tests/test_dependency_contract.py -q --timeout=120
      - name: Run the complete stable suite with coverage
        run: |
          ulimit -v 2097152
          python -m pytest tests -q --timeout=120 \
            --cov=custom_components/samsung_ac_windfree \
            --cov-report=term-missing --cov-fail-under=95
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-closure-stable-${{ matrix.runner }}
          path: |
            dependency-closure-stable.txt
            dependency-closure-stable.txt.sha256

  architecture-smoke:
    name: Runtime dependency smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build dependency smoke image
        run: |
          docker buildx build --platform "${{ matrix.platform }}" \
            --load --tag windfree-smoke:ci .github/smoke
      - name: Import runtime dependencies without network
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            --memory=2g --network=none windfree-smoke:ci \
            python -c "import smartthings_local, cbor2"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.15.21
      - run: ruff format --check custom_components tests .github/scripts
      - run: ruff check custom_components tests .github/scripts

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false

  beta-canary:
    name: Scheduled HA beta canary
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install isolated beta dependency set
        run: >-
          python -m pip install --pre --upgrade
          pytest-homeassistant-custom-component
          smartthings-local==0.1.0 cbor2==6.1.3
      - name: Capture and validate beta closure
        run: |
          python -m pip freeze --all | tee dependency-closure-beta.txt
          sha256sum dependency-closure-beta.txt | tee dependency-closure-beta.txt.sha256
          python -m pip check
          python -c "import homeassistant; print(homeassistant.__version__)"
      - name: Exercise the real dependency contract
        run: |
          ulimit -v 2097152
          python -m pytest tests/test_dependency_contract.py -q --timeout=120
      - name: Run complete beta suite
        run: |
          ulimit -v 2097152
          python -m pytest tests -q --timeout=120
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-closure-beta
          path: |
            dependency-closure-beta.txt
            dependency-closure-beta.txt.sha256

  samsung-pin-canary:
    name: Scheduled Samsung public-pin canary
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install cryptography==48.0.1
      - run: python .github/scripts/check_samsung_pins.py
      - name: Prove the canary accepted and committed nothing
        run: git diff --exit-code
